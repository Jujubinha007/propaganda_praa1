<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Concurso de Propagandas 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">

  <main class="card-login">
    <img src="img/logo-sesi-senai.png" alt="SESI | SENAI" class="logo">
    <h1>Projeto de Áudio e Vídeo - Propagandas</h1>
    <p class="subtitulo">Entre para assistir aos vídeos e votar.</p>

    <form id="formLogin">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" required autocomplete="name" placeholder="Ex.: Maria da Silva">
      </div>

      <div class="campo">
        <label for="email">E-mail institucional</label>
        <input type="email" id="email" required autocomplete="email" placeholder="seu.nome@sp.senai.br">
        <p class="dica-campo">@edu.senai.br, @sp.senai.br ou @portalsesisp.org.br</p>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password">
        <p class="dica-campo">Senha informada pelo professor.</p>
      </div>

      <button type="submit" id="botaoEntrar" class="botao-principal">Entrar</button>
    </form>

    <a href="admin.html" class="link-admin"><i class="bi bi-shield-lock"></i> Área do professor</a>
  </main>

  <script src="js/config.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
